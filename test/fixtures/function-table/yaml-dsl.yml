version: "1"
dsls:
  - id: function-table
    file_includes: ["{config_root}/*.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/function-table.schema.json"]
    function:
      definitions: [schema]
      call_result_reference_positions: []
      calls_not_allowed_at: []
      marker_function:
        call_marker: fn.
        splat_operator: "*"
        calls_without_name_allowed: true
    key_sort_orders: []
    scopes: {}
    declarations: []
    references: []
