version: "1"
dsls:
  - id: included
    file_includes: ["{config_root}/**/*.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/includes.schema.json"]
    tag_keys:
      - { tag: "!Ref", key: Ref }
    layers:
      common_layer_discovery: overlay_includes
      overlay_includes:
        - key_paths: ["$..['Fn::Transform']"]
          value_conditions:
            - { key: Name, value: "AWS::Include" }
          location_path: "$.Parameters.Location"
          location_mappings:
            - { local: "{config_root}/snippets/", remote: "s3://mock-bucket/snippets/" }
      duplicate_check: { depth: 2, key_depths: {}, skip_keys: [] }
    function:
      definitions: [schema]
      call_result_reference_positions: []
      calls_not_allowed_at: []
      marker_function:
        call_marker: "Fn::"
        splat_operator: null
        calls_without_name_allowed: true
    key_sort_orders: []
    scopes:
      LOGICAL_ID:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
    declarations:
      - path: "$.Resources.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: LOGICAL_ID
    references:
      - pattern: "^!Ref (?<name>[A-Za-z0-9]+)$"
        positions: [whole_scalar]
        text_after_name_allowed: false
        scope_name: LOGICAL_ID
        scope_group: null
        name_group: name
