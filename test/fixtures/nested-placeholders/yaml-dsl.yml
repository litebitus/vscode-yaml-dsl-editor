version: "1"
dsls:
  - id: nested-placeholders
    file_includes: ["{config_root}/*.yaml"]
    file_excludes: []
    schema_search_paths: []
    placeholder:
      pattern: "\\$\\{(?<body>(?:[^{}\\n]|\\$\\{[^{}\\n]*\\})*)\\}"
      unscanned_paths: []
    key_sort_orders: []
    scopes:
      GLOBAL:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: [region]
      local:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
    declarations:
      - path: "$.locals.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: local
    references:
      - pattern: "^local\\.(?<name>[a-z0-9_]+)(?=$|\\.)"
        positions: [placeholder_in_text]
        text_after_name_allowed: true
        scope_name: local
        scope_group: null
        name_group: name
      - pattern: "^(?<name>[a-z_]+)$"
        positions: [placeholder_in_text]
        text_after_name_allowed: false
        scope_name: GLOBAL
        scope_group: null
        name_group: name
