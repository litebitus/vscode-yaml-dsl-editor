AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions
Resources:
  Fn::ForEach::Topics:
    - TopicName
    - [MockA, MockB]
    - Topic&{TopicName}:
        Type: AWS::SNS::Topic
        Properties:
          DisplayName: mock-${TopicName}
  MockQueue:
    Type: AWS::SQS::Queue
  Fn::ForEach::Regions:
    - Region
    - [East, West]
    - Fn::ForEach::Buckets:
        - Kind
        - [Logs]
        - Bucket&{Region}&{Kind}:
            Type: AWS::S3::Bucket
Outputs:
  MockBucketName:
    Value: !Sub ${BucketEastLogs}
