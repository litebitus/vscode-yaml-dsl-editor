version: "1"
dsls:
  - id: cloudformation-template
    file_includes: ["{config_root}/*.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/../../../examples/schemas/cloudformation-2010-09-09.schema.json"]
    tag_keys:
      - { tag: "!GetAtt", key: "Fn::GetAtt" }
      - { tag: "!Ref", key: Ref }
    function:
      definitions: [schema]
      call_result_reference_positions: []
      calls_not_allowed_at: []
      marker_function:
        call_marker: "Fn::"
        splat_operator: null
        calls_without_name_allowed: true
    performance:
      compiled_schema_cache: true
    key_sort_orders: []
    scopes: {}
    declarations: []
    references: []
