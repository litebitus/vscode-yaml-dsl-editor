version: "1"
dsls:
  - id: cloudformation-template
    file_includes: ["{config_root}/*.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/../../../examples/schemas/cloudformation-2010-09-09.schema.json"]
    tag_keys:
      - { tag: "!GetAtt", key: "Fn::GetAtt" }
      - { tag: "!Ref", key: Ref }
    function:
      definitions: [schema]
      call_result_reference_positions: []
      calls_not_allowed_at: []
      marker_function:
        call_marker: "Fn::"
        splat_operator: null
        calls_without_name_allowed: true
    loops:
      scope_name: LOGICAL_ID
    placeholder:
      pattern: "[$&]\\{(?<body>[^!}][^}]*)\\}"
      unscanned_paths: []
    performance:
      compiled_schema_cache: true
    key_sort_orders: []
    scopes:
      LOGICAL_ID:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
    declarations:
      - path: "$.Resources.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: LOGICAL_ID
    references:
      - pattern: "^(?<name>[A-Za-z0-9]+)"
        positions: [whole_placeholder, placeholder_in_text]
        text_after_name_allowed: true
        scope_name: LOGICAL_ID
        scope_group: null
        name_group: name
