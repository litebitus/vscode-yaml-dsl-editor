version: "1"
dsls:
  - id: sample
    file_includes: ["**/mock.yml"]
    file_excludes: []
    schema_search_paths: []
    layers:
      overlay_folders: [one, two]
      common_layer_discovery: parent
      duplicate_check:
        depth: 3
        key_depths: {}
        skip_keys: []
    key_sort_orders:
      - path: "$"
        skip_keys: []
        order: alphabetical
        first_keys: []
        last_keys: []
      - path: "$..*"
        skip_keys: []
        order: alphabetical
        first_keys: []
        last_keys: []
    scopes:
      local:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
      RESOURCE:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: true
        builtin_names: []
    declarations:
      - path: "$.locals.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: local
      - path: "$.*.*"
        skip_keys: [locals]
        exclude_candidates: [defaults]
        name_source: key
        key_token: last_word
        name_spelling: dashes_as_underscores
        meta_argument_name: null
        declares_every_name: false
        scope_name: RESOURCE
    references:
      - pattern: "^ref (?<type>[a-z0-9_]+)\\.(?<name>[a-z0-9_]+)"
        positions: [whole_scalar]
        text_after_name_allowed: true
        scope_name: RESOURCE
        scope_group: type
        name_group: name
      - pattern: "^local\\.(?<name>[a-z0-9_]+)$"
        positions: [whole_scalar]
        text_after_name_allowed: false
        scope_name: local
        scope_group: null
        name_group: name
