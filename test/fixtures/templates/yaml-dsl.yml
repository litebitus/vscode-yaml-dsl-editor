# yaml-language-server: $schema=https://github.com/litebitus/yaml-dsl-spec/releases/latest/download/yaml-dsl-v1.schema.json
version: "1"
dsls:
  - id: mock-dsl
    file_includes: ["{config_root}/**/mock.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/mock.schema.json"]
    layers:
      overlay_folders: [dev]
      common_layer_discovery: ancestor
      duplicate_check: { depth: 3, key_depths: {}, skip_keys: [] }
    placeholder:
      pattern: "\\$\\{(?<body>[^}\\n]*)\\}"
      unscanned_paths: []
    locals:
      scope_name: local
    key_sort_orders: []
    scopes:
      local:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
      ENTRY:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: true
        builtin_names: []
    declarations:
      - path: "$.locals.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: local
      - path: "$.*.*"
        skip_keys: [locals]
        exclude_candidates: []
        name_source: key
        key_token: last_word
        name_spelling: dashes_as_underscores
        meta_argument_name: null
        declares_every_name: false
        scope_name: ENTRY
    references:
      - pattern: "^ref (?<type>[a-z0-9_]+)\\.(?<name>[a-z0-9_]+)"
        positions: [whole_scalar]
        text_after_name_allowed: true
        scope_name: ENTRY
        scope_group: type
        name_group: name
      - pattern: "^local\\.(?<name>[a-z0-9_]+)"
        positions: [whole_scalar, whole_placeholder, placeholder_in_text]
        text_after_name_allowed: true
        scope_name: local
        scope_group: null
        name_group: name
templates:
  - id: mock-dsl-templates
    dsl: mock-dsl
    file_includes: ["{config_root}/templates/**"]
    file_excludes: []
    delimiters: {left: "[[", right: "]]"}
    conditional: {if: "if", else_if: "else if", else: "else", end: "end"}
    loop:
      start: "^range (?<variables>\\$[a-z_]+) := "
      end: "end"
      variable: "\\$[a-z_]+"
    variable: "\\.[a-z_][a-z0-9_.]*"
    schema_search_paths: ["{config_root}/mock.schema.json"]
