version: "1"
dsls:
  - id: mock-merge
    file_includes: ["{config_root}/**/resources.yaml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/mock-merge.schema.json"]
    layers:
      overlay_folders: [env1]
      common_layer_discovery: ancestor
      duplicate_check:
        depth: 2
        key_depths: {}
        skip_keys: [locals]
    function:
      definitions: [schema]
      call_result_reference_positions: []
      calls_not_allowed_at: []
      marker_function:
        call_marker: fn.
        splat_operator: "*"
        calls_without_name_allowed: true
    locals:
      scope_name: local
      path_separator: "."
    key_sort_orders: []
    scopes:
      local:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
      ENTRY:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: true
        builtin_names: []
    declarations:
      - path: "$.locals.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: local
      - path: "$.*.*"
        skip_keys: [locals]
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: ENTRY
    references:
      - pattern: "^local\\.(?<name>[a-z0-9_]+)"
        positions: [whole_scalar]
        text_after_name_allowed: true
        scope_name: local
        scope_group: null
        name_group: name
      - pattern: "^ref (?<type>[a-z0-9_]+)\\.(?<name>[a-z0-9_]+)"
        positions: [whole_scalar]
        text_after_name_allowed: true
        scope_name: ENTRY
        scope_group: type
        name_group: name
