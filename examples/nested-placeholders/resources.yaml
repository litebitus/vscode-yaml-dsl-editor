locals:
  buckets:
    mock-east: mock-east-bucket
    mock-west: mock-west-bucket

bucket:
  objects:
    name: ${local.buckets.${region}}
    pattern: ${local.buckets.${region}}/*
  unread:
    # deliberate error: no reference rule reads the inner body 9, so ${9} is an unknown
    # placeholder, while the outer one is still read as local.buckets
    pattern: ${local.buckets.${9}}/*
